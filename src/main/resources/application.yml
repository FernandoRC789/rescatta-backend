spring:
  application:
    name: rescatta-backend
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB      # tamaño máximo por foto
      max-request-size: 55MB   # 5 fotos de 10MB + campos del formulario
  jackson:
    default-property-inclusion: non_null
    time-zone: America/Lima

server:
  port: ${PORT:8081}

# Almacenamiento de imágenes.
# provider=local      -> disco local, solo desarrollo (las imágenes se pierden en la nube).
# provider=r2         -> Cloudflare R2 (S3-compatible, 10GB free, sin egress).
# provider=cloudinary -> Cloudinary (free tier sin tarjeta, CDN + transformaciones).
rescatta:
  storage:
    provider: ${STORAGE_PROVIDER:local}
    base-path: ./uploads
    public-url-prefix: /uploads
    # URL pública base para local/r2. En local puede quedar vacía (devuelve /uploads/...).
    # En R2 debe ser la URL pública del bucket: https://pub-xxxx.r2.dev o tu dominio custom.
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    r2:
      endpoint: ${R2_ENDPOINT:}
      bucket: ${R2_BUCKET:}
      access-key: ${R2_ACCESS_KEY:}
      secret-key: ${R2_SECRET_KEY:}
      region: ${R2_REGION:auto}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      folder: ${CLOUDINARY_FOLDER:rescatta}
  reports:
    max-photos: 5
  catalog:
    default-search-radius-km: 10
  superadmin:
    bootstrap-secret: ${RESCATTA_SUPERADMIN_SECRET:}
  cors:
    allowed-origins: ${RESCATTA_CORS_ORIGINS:*}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/rescatta?useSSL=false&serverTimezone=America/Lima&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: Root2026!   # cambia esto por tu contraseña real de MySQL Workbench
  jpa:
    hibernate:
      ddl-auto: update   # Hibernate crea/actualiza las tablas solo, no necesitas escribir el schema a mano
    defer-datasource-initialization: true   # crea las tablas ANTES de correr data.sql (si no, data.sql falla)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: never   # ejecuta data.sql al arrancar (seed de razas, organización y mascotas demo)

---

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}


  jpa:
    hibernate:
      ddl-auto: update

    defer-datasource-initialization: true

    show-sql: false

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: never

# En producción el proveedor de storage es obligatorio: no queremos caer
# silenciosamente en disco local (las imágenes se perderían en Render).
rescatta:
  storage:
    provider: ${STORAGE_PROVIDER:}